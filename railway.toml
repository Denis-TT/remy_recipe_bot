[build]
builder = "NIXPACKS"
# ВНИМАНИЕ: ключ `aptPackages` здесь Railway игнорирует (он не входит в схему
# railway.toml), поэтому ffmpeg ставится через nixpacks.toml (nixPkgs = ffmpeg).
[build.config]
pythonVersion = "3.11"

[deploy]
startCommand = "python run.py"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
# Том под сохранённые изображения рецептов (в UI Railway: Volume → mount path /images).
volumes = ["/images"]
