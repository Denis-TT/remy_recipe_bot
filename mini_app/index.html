        // -------------------------------------------------------------- //
        //  Экран 3 — детальный рецепт
        //
        //  Дизайн:
        //   - hero: публичный `image_url` (https) или плейсхолдер «Нет фото»
        //   - крупный заголовок, описание серым
        //   - бейджи (тип / кухня / сложность / время / порции)
        //   - КБЖУ — горизонтальная сетка из 4 колонок
        //   - ингредиенты с круглыми маркерами и количеством справа
        //   - нумерованные шаги с акцентными значками
        //   - блок «💡 Советы» (жёлтый) и «🧊 Хранение» (синий)
        //
        //  Сама отрисовка вынесена в `renderRecipeBody`, обёрнутый
        //  в try/catch: если в одном из блоков случится исключение
        //  (например, неожиданный формат поля), мы покажем понятный
        //  плейсхолдер «Не удалось отобразить», а не пустую страницу.
        // -------------------------------------------------------------- //
        function renderDetailScreen() {
            const root = clearApp();
            const screen = el("div", { class: "screen detail" });

            screen.appendChild(el("div", { class: "header" }, [backBtn()]));

            if (state.loading) {
                screen.appendChild(el("div", {
                    class: "skeleton",
                    style: "height:220px;border-radius:16px;margin-bottom:18px"
                }));
                screen.appendChild(el("div", {
                    class: "skeleton",
                    style: "height:32px;border-radius:8px;margin-bottom:10px;width:70%"
                }));
                screen.appendChild(el("div", {
                    class: "skeleton",
                    style: "height:200px;border-radius:16px"
                }));
                root.appendChild(screen);
                return;
            }

            if (state.error) {
                screen.appendChild(placeholder(
                    "😕", "Не удалось загрузить", state.error,
                    function () { loadRecipe(state.currentRecipeId); }
                ));
                root.appendChild(screen);
                return;
            }

            const r = state.recipe;
            if (!r) {
                screen.appendChild(placeholder("❌", "Рецепт не найден"));
                root.appendChild(screen);
                return;
            }

            try {
                renderRecipeBody(screen, r);
            } catch (e) {
                console.error("❌ Ошибка рендера рецепта:", e, "Данные:", r);
                screen.appendChild(placeholder(
                    "⚠️",
                    "Не удалось отобразить рецепт",
                    e && e.message ? e.message : "Неизвестная ошибка рендера"
                ));
            }

            root.appendChild(screen);
        }

        // Тело детальной страницы — все секции в порядке отображения.
        // Принимает уже созданный `screen` и кладёт в него блоки.
        function renderRecipeBody(screen, r) {
            const imgUrl = (r.image_url || "").trim();
            const isHttpImage = /^https?:\/\//i.test(imgUrl);
            if (isHttpImage) {
                const hero = el("div", { class: "recipe-hero recipe-hero-photo" });
                const img = el("img", {
                    class: "hero-img",
                    src: imgUrl,
                    alt: "",
                    loading: "lazy",
                    decoding: "async",
                    onerror: function () {
                        hero.className = "recipe-hero";
                        hero.innerHTML = "";
                        hero.appendChild(el("div", { class: "hero-icon" }, ["🍽️"]));
                        hero.appendChild(el("div", { class: "hero-text" }, ["Нет фото"]));
                    }
                });
                hero.appendChild(img);
                screen.appendChild(hero);
            } else {
                screen.appendChild(el("div", { class: "recipe-hero" }, [
                    el("div", { class: "hero-icon" }, ["🍽️"]),
                    el("div", { class: "hero-text" }, ["Нет фото"])
                ]));
            }

            // 2. Заголовок и описание. textContent через el() ставит
            //    text-node, поэтому HTML внутри строк не интерпретируется.
            screen.appendChild(el("h1", { class: "recipe-title" }, [
                String(r.title || "Без названия")
            ]));
            const desc = (r.description || "").trim();
            if (desc) {
                screen.appendChild(el("p", { class: "recipe-description" }, [desc]));
            }

            // 3. Бейджи: dish_type, main_ingredient; приём пищи, кухня, …
            const badges = el("div", { class: "badges" });
            if (r.dish_type) {
                badges.appendChild(el("div", { class: "badge" },
                    [dishEmoji(r.dish_type) + " " + dishName(r.dish_type)]));
            }
            if (r.main_ingredient) {
                badges.appendChild(el("div", { class: "badge" },
                    [mainIngEmoji(r.main_ingredient) + " " + mainIngName(r.main_ingredient)]));
            }
            if (r.meal_type) {
                badges.appendChild(el("div", { class: "badge" },
                    [mealEmoji(r.meal_type) + " " + mealName(r.meal_type)]));
            }
            if (r.cuisine) {
                badges.appendChild(el("div", { class: "badge" },
                    ["🌍 " + cuisineName(r.cuisine)]));
            }
            if (r.difficulty) {
                badges.appendChild(el("div", { class: "badge" },
                    [diffEmoji(r.difficulty) + " " + diffName(r.difficulty)]));
            }
            const totalLabel = formatTime(r.total_time);
            formatRecipeTimes(r).forEach(function (tb) {
                badges.appendChild(el("div", { class: "badge" }, [tb.icon + " " + tb.label]));
            });
            const servings = Number(r.servings) || 0;
            if (servings) {
                badges.appendChild(el("div", { class: "badge" },
                    ["👥 " + servings + " порц."]));
            }
            if (badges.childNodes.length) screen.appendChild(badges);

            // 4. КБЖУ на порцию — компактная сетка 4 колонки или пояснение.
            const nutritionNoteRaw = String(r.nutrition_note || "").trim();
            const nutritionEstimated = !!r.nutrition_estimated;
            const nutritionNote = isGenericNutritionNote(nutritionNoteRaw, nutritionEstimated)
                ? "" : nutritionNoteRaw;
            const nut = nutritionPerServing(r) || {};
            const hasNutrition = ["calories", "protein", "fat", "carbs"]
                .some(function (k) { return Number(nut[k]) > 0; });
            function nutVal(v) {
                var n = Number(v) || 0;
                return nutritionEstimated && n ? "~" + n : String(n);
            }
            if (nutritionNote && !hasNutrition) {
                const noteBlock = el("div", { class: "section nutrition-note" });
                noteBlock.appendChild(el("h3", {}, ["📊 КБЖУ"]));
                noteBlock.appendChild(el("p", {}, [nutritionNote]));
                screen.appendChild(noteBlock);
            } else if (hasNutrition) {
                const grid = el("div", { class: "nutrition" });
                [
                    { v: nut.calories, l: "ккал",     e: "🔥" },
                    { v: nut.protein,  l: "белки, г", e: "💪" },
                    { v: nut.fat,      l: "жиры, г",  e: "🧈" },
                    { v: nut.carbs,    l: "углев., г", e: "🍚" }
                ].forEach(function (c) {
                    grid.appendChild(el("div", { class: "cell" }, [
                        el("div", { class: "val" }, [c.e + " " + nutVal(c.v)]),
                        el("div", { class: "lbl" }, [c.l])
                    ]));
                });
                screen.appendChild(grid);
            }

            // 5. Ингредиенты — список с круглыми маркерами слева
            //    и количеством справа.
            const ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
            if (ingredients.length) {
                const section = el("div", { class: "section" });
                section.appendChild(el("h3", {}, ["🛒 Ингредиенты"]));
                const ul = el("ul", { class: "ingredients-modern" });
                ingredients.forEach(function (ing) {
                    ul.appendChild(renderIngredient(ing));
                });
                section.appendChild(ul);
                screen.appendChild(section);
            }

            // 6. Шаги — нумерованный список. Сортируем по `step_number`
            //    на случай, если из БД пришли вразнобой.
            const steps = Array.isArray(r.steps) ? r.steps : [];
            if (steps.length) {
                const section = el("div", { class: "section" });
                section.appendChild(el("h3", {}, ["📝 Приготовление"]));
                const ol = el("ol", { class: "steps" });
                const sorted = steps.slice().sort(function (a, b) {
                    const an = Number(a && a.step_number) || 0;
                    const bn = Number(b && b.step_number) || 0;
                    return an - bn;
                });
                sorted.forEach(function (s) {
                    const text = (s && typeof s === "object")
                        ? String(s.description || "").trim()
                        : String(s || "").trim();
                    if (!text) return;
                    ol.appendChild(el("li", {}, [text]));
                });
                section.appendChild(ol);
                screen.appendChild(section);
            }

            // 7. Советы — мягкий жёлтый блок.
            const tips = Array.isArray(r.tips) ? r.tips.filter(function (t) {
                return t != null && String(t).trim() !== "";
            }) : [];
            if (tips.length) {
                const section = el("div", { class: "section tips" });
                section.appendChild(el("h3", {}, ["💡 Советы"]));
                const ul = el("ul");
                tips.forEach(function (t) {
                    const txt = (t && typeof t === "object")
                        ? String(t.text || "").trim()
                        : String(t).trim();
                    if (!txt) return;
                    ul.appendChild(el("li", {}, [txt]));
                });
                section.appendChild(ul);
                screen.appendChild(section);
            }

            // 8. Хранение — холодный синий блок.
            const storage = String(r.storage || "").trim();
            if (storage) {
                const section = el("div", { class: "section storage" });
                section.appendChild(el("h3", {}, ["🧊 Хранение"]));
                section.appendChild(el("p", {}, [storage]));
                screen.appendChild(section);
            }

            // 9. Источник — внешняя ссылка.
            if (r.source_url) {
                const section = el("div", { class: "section" });
                section.appendChild(el("h3", {}, ["🔗 Источник"]));
                section.appendChild(el("a", {
                    href: r.source_url,
                    target: "_blank",
                    rel: "noopener",
                    style: "color:var(--accent);word-break:break-all"
                }, [String(r.source_url)]));
                screen.appendChild(section);
            }

            if (!IS_DEMO && (r.id != null && r.id !== "")) {
                const wrap = el("div", { class: "recipe-action-stack" });
                const idStr = r.id;
                wrap.appendChild(el("button", {
                    class: "recipe-share-btn",
                    type: "button",
                    onclick: function (ev) {
                        ev.preventDefault();
                        shareRecipe(idStr);
                    }
                }, ["📤 Поделиться"]));
                wrap.appendChild(el("button", {
                    class: "recipe-delete-btn",
                    type: "button",
                    disabled: state.deleting,
                    onclick: function (ev) {
                        ev.preventDefault();
                        performDeleteRecipe(idStr);
                    }
                }, ["🗑 Удалить рецепт"]));
                screen.appendChild(wrap);
            }
        }

        // Один пункт ингредиента: круглый маркер (через CSS ::before),
        // название слева, количество + единица справа. Маркер нерискованно
        // ставится во всех случаях — даже если ингредиент пришёл строкой.
        function cleanEstimatedMarker(text) {
            return String(text || "").replace(/\s*\*+\s*$/, "").trim();
        }

        function isServingNote(text) {
            return /(по вкусу|по желанию|для подачи|для украшения|опционально|по необходимости)/i
                .test(String(text || ""));
        }

        function extractQuantityFromNotes(notes) {
            const src = cleanEstimatedMarker(notes);
            const re = /^\s*(\d+(?:[.,]\d+)?(?:\s*[-–—]\s*\d+(?:[.,]\d+)?)?)\s*(г|гр|кг|мл|л|шт|ст\.?\s*л\.?|ч\.?\s*л\.?|стол\.?\s*л\.?|чайн\.?\s*л\.?)(?=\s|\.|,|$)\.?\s*(.*)$/i;
            const m = src.match(re);
            if (!m) return null;
            return {
                quantity: (m[1] + " " + m[2]).replace(/\s+/g, " ").trim(),
                rest: String(m[3] || "").replace(/^[,;:—–-]\s*/, "").trim()
            };
        }

        function toggleEstimatedTooltip(host) {
            const existing = host.querySelector(".ingredient-tooltip");
            document.querySelectorAll(".ingredient-tooltip").forEach(function (node) {
                if (node !== existing && node.parentNode) node.parentNode.removeChild(node);
            });
            if (existing) {
                existing.parentNode.removeChild(existing);
                return;
            }
            host.appendChild(el("span", { class: "ingredient-tooltip" }, [
                "Это количество сгенерировано ИИ, так как в оригинальном рецепте граммовка не указана"
            ]));
        }

        function renderIngredient(ing) {
            if (!ing || typeof ing !== "object") {
                return el("li", {}, [
                    el("span", { class: "ing-name" }, [String(ing || "—")]),
                    el("span", { class: "ing-amount" }, [""])
                ]);
            }
            const amount = Number(ing.amount);
            const amountStr = (Number.isFinite(amount) && amount > 0) ? String(amount) : "";
            const unit = String(ing.unit || "").trim();
            let right = [amountStr, unit].filter(Boolean).join(" ");

            const baseName = String(ing.name || "").trim();
            let notes = cleanEstimatedMarker(ing.notes);
            if (!right) {
                const extracted = extractQuantityFromNotes(notes);
                if (extracted) {
                    right = extracted.quantity;
                    notes = extracted.rest;
                } else if (isServingNote(notes)) {
                    right = notes;
                    notes = "";
                }
            }
            const fullName = baseName + (notes ? " (" + notes + ")" : "");
            const estimated = ing.estimated === true;
            const amountChildren = [right || "—"];
            const amountProps = { class: "ing-amount" + (estimated ? " ing-amount--estimated" : "") };
            if (estimated) {
                amountProps.onclick = function (ev) {
                    ev.stopPropagation();
                    toggleEstimatedTooltip(ev.currentTarget);
                };
                amountChildren.push(el("span", { class: "estimated-star", role: "button" }, ["*"]));
            }

            return el("li", {}, [
                el("span", { class: "ing-name" }, [fullName || "—"]),
                el("span", amountProps, amountChildren)
            ]);
        }

        // ================================================================ //
        //  Загрузчики данных
        // ================================================================ //

        async function loadDishTree() {
            state.loading = true;
            state.error = null;
            render();
            try {
                var res = await fetchDishTree(USER_ID);
                state.dishTree = res.tree;
                state.dishIdTree = res.idTree;
                state.searchIndex = res.searchIndex;
            } catch (e) {
                state.error = e.message || "Неизвестная ошибка";
                console.error(e);
            } finally {
                state.loading = false;
                render();
            }
        }

        /** Фоновое обновление дерева категорий без экрана загрузки (после удаления). */
        function refreshDishTreeQuiet() {
            if (IS_DEMO) return;
            fetchDishTree(USER_ID).then(function (res) {
                state.dishTree = res.tree;
                state.dishIdTree = res.idTree;
                state.searchIndex = res.searchIndex;
                render();
            }).catch(function (e) { console.warn("dish tree refresh", e); });
        }

        function showDeleteConfirmModal(onConfirm) {
            if (typeof onConfirm !== "function") return;
            var prevOverflow = document.body.style.overflow;
            var closed = false;

            var root = el("div", {
                class: "delete-confirm-overlay",
                role: "dialog",
                "aria-modal": "true",
                "aria-labelledby": "delete-confirm-question"
            });
            var card = el("div", { class: "delete-confirm-card" });
            var question = el("p", {
                class: "delete-confirm-text",
                id: "delete-confirm-question"
            }, ["Удалить этот рецепт?"]);
            var row = el("div", { class: "delete-confirm-row" });
            var btnDelete = el("button", {
                class: "delete-confirm-btn delete-confirm-btn--danger",
                type: "button"
            }, ["Удалить"]);
            var btnCancel = el("button", {
                class: "delete-confirm-btn delete-confirm-btn--cancel",
                type: "button"
            }, ["Отмена"]);

            function restoreBody() {
                document.body.style.overflow = prevOverflow;
            }

            function onKey(ev) {
                if (closed) return;
                if (ev.key === "Escape" || ev.key === "Esc") {
                    ev.preventDefault();
                    ev.stopPropagation();
                    close();
                }
            }
            function onBackdropPointerDown(e) {
                if (closed) return;
                if (e.target === root) e.preventDefault();
            }
            function onBackdropClick(e) {
                if (closed) return;
                if (e.target === root) close();
            }
            function onCardClick(e) {
                e.stopPropagation();
            }

            function onCancelClick() {
                close();
            }
            function onDeleteClick() {
                if (closed) return;
                close();
                onConfirm();
            }

            function close() {
                if (closed) return;
                closed = true;
                document.removeEventListener("keydown", onKey, true);
                btnCancel.removeEventListener("click", onCancelClick);
                btnDelete.removeEventListener("click", onDeleteClick);
                if (root) {
                    root.removeEventListener("click", onBackdropClick);
                    root.removeEventListener("pointerdown", onBackdropPointerDown, true);
                }
                if (card) {
                    card.removeEventListener("click", onCardClick);
                }
                if (root && root.parentNode) {
                    root.parentNode.removeChild(root);
                }
                restoreBody();
            }

            btnCancel.addEventListener("click", onCancelClick);
            btnDelete.addEventListener("click", onDeleteClick);
            /* На десктопе: слева «Отмена», справа «Удалить» */
            row.appendChild(btnCancel);
            row.appendChild(btnDelete);
            card.appendChild(question);
            card.appendChild(row);
            /* capture на document — срабатывает до вложенного контента; снимаем в close() */
            document.addEventListener("keydown", onKey, true);
            root.addEventListener("pointerdown", onBackdropPointerDown, true);
            root.addEventListener("click", onBackdropClick);
            card.addEventListener("click", onCardClick);

            document.body.style.overflow = "hidden";
            root.appendChild(card);
            document.body.appendChild(root);
            try {
                btnCancel.focus();
            } catch (e) { /* ignore */ }
        }

        function showDeleteConfirm(onDelete) {
            if (typeof onDelete !== "function") return;
            if (tg && typeof tg.showPopup === "function") {
                try {
                    tg.showPopup({
                        message: "Удалить этот рецепт?",
                        buttons: [
                            { id: "delete", type: "destructive", text: "Удалить" },
                            { type: "cancel", text: "Отмена" }
                        ]
                    }, function (buttonId) {
                        if (buttonId === "delete") onDelete();
                    });
                    return;
                } catch (e) { /* fallback: своя модалка */ }
            }
            showDeleteConfirmModal(onDelete);
        }

        function shareRecipe(recipeId) {
            if (IS_DEMO) return;
            const id = String(recipeId || "").trim();
            const uid = USER_ID || getUserId(tg);
            if (!id || !uid) return;

            (async function () {
                try {
                    await apiUpsert(
                        "pending_shares",
                        { user_id: uid, recipe_id: id },
                        "user_id"
                    );
                } catch (e) {
                    console.error(e);
                    if (typeof tg !== "undefined" && tg && typeof tg.showAlert === "function") {
                        tg.showAlert("Не удалось подготовить отправку. Попробуйте позже.");
                    } else {
                        window.alert("Не удалось подготовить отправку. Попробуйте позже.");
                    }
                    return;
                }
                const botLink = "https://t.me/remy_recipe_bot";
                if (tg && typeof tg.openTelegramLink === "function") {
                    tg.openTelegramLink(botLink);
                } else {
                    window.open(botLink, "_blank");
                }
                if (tg && typeof tg.showAlert === "function") {
                    tg.showAlert(
                        "Откройте чат с ботом — рецепт будет отправлен автоматически."
                    );
                }
            })();
        }

        function notifyRecipeDeleted() {
            try {
                if (tg && typeof tg.showAlert === "function") {
                    tg.showAlert("Рецепт удалён");
                } else {
                    window.alert("Рецепт удалён");
                }
            } catch (e) {
                window.alert("Рецепт удалён");
            }
        }

        function notifyDeleteError(msg) {
            var m = msg || "Не удалось удалить рецепт.";
            try {
                if (tg && typeof tg.showAlert === "function") {
                    tg.showAlert(m);
                } else {
                    window.alert(m);
                }
            } catch (e) {
                window.alert(m);
            }
        }

        function isDeleteNetworkError(e) {
            if (!e) return false;
            if (e.name === "TypeError") return true;
            var t = String(e.message || e).toLowerCase();
            return /failed to fetch|network|load failed|aborted|timeout/.test(t);
        }

        function performDeleteRecipe(recipeId) {
            if (IS_DEMO) return;
            if (state.deleting) return;
            var rid = String(recipeId);
            showDeleteConfirm(function () {
                (async function () {
                    state.deleting = true;
                    render();
                    try {
                        await apiDelete("recipes?id=eq." + encodeURIComponent(rid));
                    } catch (e) {
                        state.deleting = false;
                        console.error(e);
                        if (isDeleteNetworkError(e)) {
                            notifyDeleteError("Не удалось удалить рецепт. Проверьте соединение.");
                        } else {
                            notifyDeleteError(
                                (e && e.message) ? e.message : "Не удалось удалить рецепт."
                            );
                        }
                        render();
                        return;
                    }
                    removeRecipeViewedInStorage(rid);
                    state.deleting = false;
                    state.recipe = null;
                    goBack();
                    refreshDishTreeQuiet();
                    notifyRecipeDeleted();
                })();
            });
        }

        async function loadRecipes(dishType, mainIngredient) {
            state.loading = true;
            state.error = null;
            state.recipes = null;
            render();
            try {
                state.recipes = await fetchRecipes(USER_ID, dishType, mainIngredient);
            } catch (e) {
                state.error = e.message || "Неизвестная ошибка";
                console.error(e);
            } finally {
                state.loading = false;
                render();
            }
        }

        async function loadRecipe(recipeId) {
            state.deleting = false;
            state.loading = true;
            state.error = null;
            state.recipe = null;
            render();
            try {
                console.info("📖 Загружаем рецепт:", recipeId);
                state.recipe = await fetchRecipe(recipeId);
                if (!state.recipe) {
                    state.error = "Рецепт не найден";
                    console.warn("⚠️ Рецепт не найден в Supabase, id =", recipeId);
                } else {
                    // Помечаем просмотренным только после успешной загрузки.
                    markRecipeViewedInStorage(recipeId);
                    console.info("✅ Рецепт загружен:", state.recipe);
                }
            } catch (e) {
                state.error = e.message || "Неизвестная ошибка";
                console.error("❌ Ошибка загрузки рецепта:", e);
            } finally {
                state.loading = false;
                render();
            }
        }

        // ================================================================ //
        //  Actions
        // ================================================================ //

        function openDishType(dishKey) {
            const sub = (state.dishTree && state.dishTree[dishKey]) || {};
            const mkeys = Object.keys(sub);
            if (mkeys.length === 1) {
                const only = mkeys[0];
                navigate({
                    screen: "recipes",
                    currentDishType: dishKey,
                    currentMainIngredient: only,
                    recipes: null
                });
                loadRecipes(dishKey, only);
                return;
            }
            navigate({
                screen: "main_ingredients",
                currentDishType: dishKey,
                currentMainIngredient: null,
                recipes: null
            });
        }

        function openMainIngredient(mainKey) {
            const dk = state.currentDishType;
            if (!dk) return;
            navigate({
                screen: "recipes",
                currentDishType: dk,
                currentMainIngredient: mainKey,
                recipes: null
            });
            loadRecipes(dk, mainKey);
        }

        function openRecipe(id) {
            navigate({
                screen: "detail",
                currentRecipeId: id,
                recipe: null
            });
            loadRecipe(id);
            try {
                tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
            } catch (_) { /* noop */ }
        }

        // ================================================================ //
        //  Диспетчер render
        // ================================================================ //

        function render() {
            if (state.screen === "dish_types") renderDishTypesScreen();
            else if (state.screen === "main_ingredients") renderMainIngredientsScreen();
            else if (state.screen === "recipes") renderRecipesScreen();
            else if (state.screen === "detail") renderDetailScreen();
            syncTelegramBackButton();
        }

        // ================================================================ //
        //  Bootstrap
        // ================================================================ //

        function mountDemoBadge() {
            if (!IS_DEMO) return;
            if (document.querySelector(".demo-badge")) return;
            const badge = document.createElement("div");
            badge.className = "demo-badge";
            badge.textContent = "Демо-режим";
            badge.title = "user_id не определён — работаю без Telegram WebApp";
            document.body.appendChild(badge);
        }

        window.addEventListener("DOMContentLoaded", function () {
            mountDemoBadge();
            render();
            (async function bootstrap() {
                if (!IS_DEMO) {
                    state.loading = true;
                    render();
                    try {
                        await authenticateTelegram();
                    } catch (e) {
                        state.error = (e && e.message) ? e.message : String(e);
                        console.error(e);
                    } finally {
                        state.loading = false;
                        render();
                    }
                    if (state.error) return;
                }
                await initViewedState();
                loadDishTree();
            })();
        });

        // Telegram: safe area и viewport — см. applyTelegramInsets() выше.

        // Экспортируем минимум для ручного тестирования из DevTools.
        window.__remy = {
            state: state,
            loadDishTree: loadDishTree,
            loadRecipes: loadRecipes,
            loadRecipe: loadRecipe,
            LOCALE: LOCALE,
            getViewedState: getViewedState,
            getViewedRecipeSet: getViewedRecipeSet,
            markRecipeViewedInStorage: markRecipeViewedInStorage,
            removeRecipeViewedInStorage: removeRecipeViewedInStorage
        };
    })();
    </script>
</body>
